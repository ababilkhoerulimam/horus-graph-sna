[project]
name = "horus-graph"
version = "0.1.0"
description = "Modular, domain-agnostic SNA engine: reads a data bundle, computes multilayer network metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["horus_graph"]

[project.scripts]
horus-graph = "horus_graph.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # `/ws/copilot` butuh implementasi WebSocket di sisi server. Copilot tetap
    # berjalan tanpanya lewat REST, tetapi drawer memakai kanal WebSocket.
    "websockets>=12",
]
# Jawaban bebas dari LLM. Tanpa ekstra ini copilot memakai jalur deterministik.
llm = ["openai>=1.40"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.17",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv"]
filterwarnings = [
    # Peringatan dari starlette tentang httpx 1.x, bukan dari kode repo ini.
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]


[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "presentation"]

[tool.ruff.lint]
# Sengaja tanpa `UP`: repo memakai gaya `Dict[...]`/`Optional[...]` secara
# konsisten, dan mengubah 700 anotasi bukan perbaikan yang sepadan risikonya.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = [
    # `Depends(...)` di nilai default adalah pola FastAPI, bukan bug.
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["horus_graph"]

[tool.ruff.lint.per-file-ignores]
# Impor di blok `TYPE_CHECKING` adalah re-ekspor untuk pemeriksa tipe; isinya
# dijaga `_LAZY` + `__all__`, bukan oleh pemakaian langsung di berkas ini.
"horus_graph/enhance/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = ["horus_graph"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
