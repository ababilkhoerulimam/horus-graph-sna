[project]
name = "horus-graph"
version = "0.1.0"
description = "Modular, domain-agnostic SNA engine: reads a data bundle, computes multilayer network metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["horus_graph"]

[project.scripts]
horus-graph = "horus_graph.cli:main"

[project.optional-dependencies]
# Hanya untuk alat migrasi `export-legacy` yang membaca config horus-agent (yaml).
legacy = ["pyyaml>=6.0"]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # `/ws/copilot` butuh implementasi WebSocket di sisi server. Copilot tetap
    # berjalan tanpanya lewat REST, tetapi drawer memakai kanal WebSocket.
    "websockets>=12",
]
# Jawaban bebas dari LLM. Tanpa ekstra ini copilot memakai jalur deterministik.
llm = ["openai>=1.40"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv"]
filterwarnings = [
    # Peringatan dari starlette tentang httpx 1.x, bukan dari kode repo ini.
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]
